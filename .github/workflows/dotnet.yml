# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore MiVo.Text.Replacer.Tests
    - name: Build
      run: dotnet build --no-restore MiVo.Text.Replacer.Tests
    - name: Test
      run: dotnet test --no-build --verbosity normal MiVo.Text.Replacer.Tests

  package-and-release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore MiVo.Text.Replacer
    - name: Build
      run: dotnet build --configuration Release --no-restore MiVo.Text.Replacer
    - name: Create NuGet package
      run: dotnet pack --configuration Release --no-build --output ./nupkg MiVo.Text.Replacer
    - name: Get version
      id: get_version
      run: |
        VERSION=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' MiVo.Text.Replacer/MiVo.Text.Replacer.csproj)
        if [ -z "$VERSION" ]; then
          echo "Error: Could not extract version from project file"
          exit 1
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.get_version.outputs.VERSION }}
        name: Release v${{ steps.get_version.outputs.VERSION }}
        files: ./nupkg/*.nupkg
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
